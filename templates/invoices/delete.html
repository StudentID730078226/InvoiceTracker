{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>Delete invoice #{{ invoice.pk }}?</h1><p>{{ invoice.original_filename }} · {{ invoice.get_status_display }}</p><p>This permanently removes the invoice, its event history and source document. This cannot be undone.</p><form method="post" onsubmit="return confirm('Are you sure you want to permanently delete this invoice and its source document? This cannot be undone.');">{% csrf_token %}<input type="hidden" name="confirm" value="yes"><button class="button-danger" type="submit">Delete invoice and document</button> <a href="{{ invoice.get_absolute_url }}">Cancel</a></form></section>{% endblock %}
