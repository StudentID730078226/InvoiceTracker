name: Application tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Python code checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Flake8
        run: python -m pip install flake8==7.5.0
      - name: Check application Python code
        run: python -m flake8 manage.py accounts invoices config extraction/layoutlmv1

  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-only-key-not-for-deployment
      DEBUG: "False"
      INVOICE_MODEL_DEVICE: cpu
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt

      - name: Prepare mocked checkpoint directory
        # Integration tests mock model loading; no weights are downloaded.
        run: mkdir -p models/layoutlm-v1-invoice

      - name: Check Django configuration
        run: python manage.py check

      - name: Run all application tests
        run: python manage.py test accounts invoices --noinput
